services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ethics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./DDL Script.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
      - ./ethics_db_tables.sql:/docker-entrypoint-initdb.d/02-tables.sql:ro
      - ./ethics_db_functions.sql:/docker-entrypoint-initdb.d/03-functions.sql:ro
      - ./ethics_db_tables_constraints.sql:/docker-entrypoint-initdb.d/04-constraints.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ethics_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    mem_reservation: 512m
    cpus: '2'
    networks:
      - ethics-net

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ethics_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-postgres}@postgres:5432/ethics_db
    volumes:
      - backups:/app/backups
      - uploads:/app/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/monitoring/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 512m
    mem_reservation: 256m
    cpus: '1.5'
    networks:
      - ethics-net

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    mem_reservation: 128m
    cpus: '0.5'
    networks:
      - ethics-net

volumes:
  pgdata:
  backups:
  uploads:

networks:
  ethics-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
