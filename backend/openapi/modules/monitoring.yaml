paths:
  /monitoring/health:
    get:
      tags: [Health]
      summary: Health check
      description: Public endpoint. Returns DB connectivity status and system diagnostics.
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../components.yaml#/components/schemas/successResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          service:
                            type: string
                            example: ethics-erm-api
                          version:
                            type: string
                            example: 1.0.0
                          status:
                            type: string
                            example: healthy
                          requestId:
                            type: string
                          uptime:
                            type: number
                          timestamp:
                            type: string
                            format: date-time
                          checks:
                            type: object
                            properties:
                              database:
                                type: string
                                example: healthy
                              smtp:
                                type: string
                                example: configured
        '503':
          description: Service unhealthy

  /monitoring/audit:
    get:
      tags: [Monitoring]
      summary: Get system audit log
      responses:
        '200':
          description: Audit log entries

  /monitoring/config:
    get:
      tags: [Monitoring]
      summary: Get system configuration
      responses:
        '200':
          description: System configuration
