name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  DB_NAME: ethics_db_test
  DB_USER: postgres
  DB_PASSWORD: postgres
  JWT_SECRET: ci-test-secret-hex-for-github-actions-ci
  REQUIRED_ENV_VARS: DB_NAME DB_USER DB_PASSWORD JWT_SECRET
  AUDIT_LEVEL: high
  AUDIT_PRODUCTION_ONLY: 'false'
  AUDIT_ENABLED: 'true'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required environment variables
        run: |
          missing=0
          for var in $REQUIRED_ENV_VARS; do
            if [ -z "${!var}" ]; then
              echo "::error::Required env var $var is not set"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All required environment variables are set"

  backend:
    runs-on: ubuntu-latest
    needs: [validate]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ${{ env.DB_NAME }}
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Bootstrap database
        run: |
          PGPASSWORD=${{ env.DB_PASSWORD }} psql -h localhost -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -f ../DDL\ Script.sql
          PGPASSWORD=${{ env.DB_PASSWORD }} psql -h localhost -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -f ../ethics_db_tables.sql
          PGPASSWORD=${{ env.DB_PASSWORD }} psql -h localhost -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -f ../ethics_db_functions.sql
          PGPASSWORD=${{ env.DB_PASSWORD }} psql -h localhost -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -f ../ethics_db_tables_constraints.sql

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        env:
          AUDIT_LEVEL: ${{ env.AUDIT_LEVEL }}
          AUDIT_PRODUCTION_ONLY: ${{ env.AUDIT_PRODUCTION_ONLY }}
          AUDIT_ENABLED: ${{ env.AUDIT_ENABLED }}
        run: |
          if [ "$AUDIT_ENABLED" != "true" ]; then
            echo "npm audit disabled by AUDIT_ENABLED=$AUDIT_ENABLED"
            exit 0
          fi
          PROD_FLAG=""
          if [ "$AUDIT_PRODUCTION_ONLY" = "true" ]; then
            PROD_FLAG="--production"
          fi
          echo "Running npm audit (threshold: $AUDIT_LEVEL, production-only: $AUDIT_PRODUCTION_ONLY)"
          npm audit --json $PROD_FLAG > audit-backend-report.json 2>&1 || true
          npm audit --audit-level=$AUDIT_LEVEL $PROD_FLAG

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-backend-report
          path: audit-backend-report.json
          retention-days: 30

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          JWT_SECRET: ${{ env.JWT_SECRET }}

  frontend:
    runs-on: ubuntu-latest
    needs: [validate]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        env:
          AUDIT_LEVEL: ${{ env.AUDIT_LEVEL }}
          AUDIT_PRODUCTION_ONLY: ${{ env.AUDIT_PRODUCTION_ONLY }}
          AUDIT_ENABLED: ${{ env.AUDIT_ENABLED }}
        run: |
          if [ "$AUDIT_ENABLED" != "true" ]; then
            echo "npm audit disabled by AUDIT_ENABLED=$AUDIT_ENABLED"
            exit 0
          fi
          PROD_FLAG=""
          if [ "$AUDIT_PRODUCTION_ONLY" = "true" ]; then
            PROD_FLAG="--production"
          fi
          echo "Running npm audit (threshold: $AUDIT_LEVEL, production-only: $AUDIT_PRODUCTION_ONLY)"
          npm audit --json $PROD_FLAG > audit-frontend-report.json 2>&1 || true
          npm audit --audit-level=$AUDIT_LEVEL $PROD_FLAG

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-frontend-report
          path: audit-frontend-report.json
          retention-days: 30

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint || true  # non-blocking (warnings allowed)

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ${{ env.DB_NAME }}
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Bootstrap database
        run: |
          PGPASSWORD=${{ env.DB_PASSWORD }} psql -h localhost -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -f DDL\ Script.sql
          PGPASSWORD=${{ env.DB_PASSWORD }} psql -h localhost -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -f ethics_db_tables.sql
          PGPASSWORD=${{ env.DB_PASSWORD }} psql -h localhost -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -f ethics_db_functions.sql
          PGPASSWORD=${{ env.DB_PASSWORD }} psql -h localhost -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -f ethics_db_tables_constraints.sql

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Start backend server
        run: |
          nohup node dist/index.js > /tmp/server-output.log 2>&1 &
          sleep 5
          echo "Server PID: $!"
        working-directory: backend
        env:
          PORT: 8080
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          NODE_ENV: ci

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/monitoring/health > /dev/null 2>&1; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start" && exit 1

      - name: Run E2E tests
        run: pwsh -File scripts/e2e-full-test.ps1 -Base 'http://localhost:8080/api/v1'

      - name: Show server output on failure
        if: failure()
        run: |
          echo "=== Server process status ==="
          ps aux | grep node || true
          echo "=== Server output ==="
          cat /tmp/server-output.log 2>/dev/null || echo "No log file"

  docker:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend Docker meta
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=false

      - name: Frontend Docker meta
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=false

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/backend:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          output: trivy-backend-report.txt

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/frontend:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          output: trivy-frontend-report.txt

      - name: Download audit reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: audit-*-report
          merge-multiple: true

      - name: Generate audit summary
        if: always()
        continue-on-error: true
        run: |
          echo "## npm Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f audit-backend-report.json ]; then
            echo "### Backend" >> $GITHUB_STEP_SUMMARY
            node -e "
              const r = require('./audit-backend-report.json');
              const v = r.metadata ? r.metadata.vulnerabilities || {} : {};
              console.log('| Severity | Count |');
              console.log('|----------|-------|');
              ['critical','high','moderate','low'].forEach(function(s) {
                console.log('| ' + s + ' | ' + (v[s] || 0) + ' |');
              });
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "Backend audit report not available" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f audit-frontend-report.json ]; then
            echo "### Frontend" >> $GITHUB_STEP_SUMMARY
            node -e "
              const r = require('./audit-frontend-report.json');
              const v = r.metadata ? r.metadata.vulnerabilities || {} : {};
              console.log('| Severity | Count |');
              console.log('|----------|-------|');
              ['critical','high','moderate','low'].forEach(function(s) {
                console.log('| ' + s + ' | ' + (v[s] || 0) + ' |');
              });
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "Frontend audit report not available" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-*-report.txt
          retention-days: 30
